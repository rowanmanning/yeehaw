display_information:
  name: Yeehaw
  description: Race them horses
  background_color: "#755f48"
  long_description: Stage exciting horse races from the comfort of any Slack channel. Yeehaw! Just invite the bot to your channel and use the `/race` command to get started. Before the race starts, you'll have a chance to bet on the winning horse.
features:
  bot_user:
    display_name: Yeehaw
    always_online: false
  shortcuts:
    - name: Start a race
      type: global
      callback_id: race
      description: Start a race! Yeehaw!
  slash_commands:
    - command: /race
      url: https://example.com/slack/events
      description: Start a race! Yeehaw!
      should_escape: true
oauth_config:
  redirect_urls:
    - https://example.com/slack/redirect
  scopes:
    bot:
      - app_mentions:read
      - channels:join
      - channels:read
      - chat:write
      - commands
      - groups:read
      - im:read
      - mpim:history
settings:
  event_subscriptions:
    request_url: https://example.com/slack/events
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
    request_url: https://example.com/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
